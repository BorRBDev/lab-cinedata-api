name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # mongodb-memory-server descarga mongod; no hace falta servicio Mongo.
      # CORS_ORIGIN y JWT_SECRET los define el propio test.
      - run: npm test
